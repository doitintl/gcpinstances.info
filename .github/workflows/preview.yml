name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  preview:
    name: Deploy preview
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          BASE_PATH: /previews/pr-${{ github.event.pull_request.number }}/
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.IAM_ROLE }}
          aws-region: us-east-1

      - name: Deploy to S3
        run: aws s3 sync ./dist s3://gcpinstances.doit.com/previews/pr-${{ github.event.pull_request.number }}/

      - name: Comment preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const url = `https://gcpinstances.doit.com/previews/pr-${{ github.event.pull_request.number }}/`
            const marker = '<!-- preview-url -->'
            const body = `${marker}\n🔗 **Preview:** ${url}`

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ github.event.pull_request.number }},
            })

            const existing = comments.find(c => c.body.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: ${{ github.event.pull_request.number }},
                body,
              })
            }
