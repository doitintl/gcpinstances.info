name: PR Preview Cleanup

on:
  pull_request:
    types: [closed]

permissions:
  id-token: write
  contents: read

jobs:
  cleanup:
    name: Remove preview
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.IAM_ROLE }}
          aws-region: us-east-1

      - name: Delete preview from S3
        run: aws s3 rm s3://gcpinstances.doit.com/previews/pr-${{ github.event.pull_request.number }}/ --recursive
