name: Fetch GCP Pricing

on:
  schedule:
    # Run at 6:00 UTC every day
    - cron: '0 6 * * *'
  workflow_dispatch:  # Allow manual runs

permissions:
  contents: write
  pull-requests: write

jobs:
  fetch:
    name: Fetch and update pricing data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch Compute Engine pricing data
        env:
          GOOGLE_CLOUD_API_KEY: ${{ secrets.GOOGLE_CLOUD_API_KEY }}
        run: npm run fetch-pricing

      - name: Fetch Cloud SQL pricing data
        env:
          GOOGLE_CLOUD_API_KEY: ${{ secrets.GOOGLE_CLOUD_API_KEY }}
        run: npm run fetch-cloudsql-pricing

      - name: Fetch Memorystore pricing data
        env:
          GOOGLE_CLOUD_API_KEY: ${{ secrets.GOOGLE_CLOUD_API_KEY }}
        run: npm run fetch-memorystore-pricing

      - name: Fetch AlloyDB pricing data
        env:
          GOOGLE_CLOUD_API_KEY: ${{ secrets.GOOGLE_CLOUD_API_KEY }}
        run: npm run fetch-alloydb-pricing

      - name: Fetch exchange rates
        run: npm run fetch-exchange-rates

      - name: Validate pricing data
        env:
          GOOGLE_CLOUD_API_KEY: ${{ secrets.GOOGLE_CLOUD_API_KEY }}
          SAMPLE_SIZE: 10
        run: npm run validate

      - name: Check for changes
        id: changes
        run: |
          CHANGED=false
          for f in public/data/pricing.json public/data/cloudsql-pricing.json public/data/memorystore-pricing.json public/data/alloydb-pricing.json public/data/exchange-rates.json; do
            if ! git diff --quiet "$f"; then
              CHANGED=true
            fi
          done
          echo "changed=$CHANGED" >> $GITHUB_OUTPUT

      - name: Open and merge pricing-update PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y-%m-%d)
          BRANCH="chore/pricing-${DATE}-${GITHUB_RUN_ID}"
          TITLE="chore: update GCP pricing data [${DATE}]"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add public/data/pricing.json public/data/cloudsql-pricing.json public/data/memorystore-pricing.json public/data/alloydb-pricing.json public/data/exchange-rates.json
          git commit -m "$TITLE"
          git push -u origin "$BRANCH"

          # The master branch ruleset requires every change to come through a
          # PR. There are no required approvals and no required status checks,
          # so we can open and immediately squash-merge this PR from the same
          # workflow.
          gh pr create \
            --base master \
            --head "$BRANCH" \
            --title "$TITLE" \
            --body "Automated daily pricing refresh. Generated by .github/workflows/fetch-pricing.yml (run ${GITHUB_RUN_ID})."

          gh pr merge "$BRANCH" --squash --delete-branch
