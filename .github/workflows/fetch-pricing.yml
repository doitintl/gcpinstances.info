name: Fetch GCP Pricing

on:
  schedule:
    # Run at 6:00 UTC every day
    - cron: '0 6 * * *'
  workflow_dispatch:  # Allow manual runs

permissions:
  contents: write

jobs:
  fetch:
    name: Fetch and update pricing data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch Compute Engine pricing data
        env:
          GOOGLE_CLOUD_API_KEY: ${{ secrets.GOOGLE_CLOUD_API_KEY }}
        run: npm run fetch-pricing

      - name: Fetch Cloud SQL pricing data
        env:
          GOOGLE_CLOUD_API_KEY: ${{ secrets.GOOGLE_CLOUD_API_KEY }}
        run: npm run fetch-cloudsql-pricing

      - name: Validate pricing data
        env:
          GOOGLE_CLOUD_API_KEY: ${{ secrets.GOOGLE_CLOUD_API_KEY }}
          SAMPLE_SIZE: 10
        run: npm run validate

      - name: Check for changes
        id: changes
        run: |
          CE_CHANGED=false
          SQL_CHANGED=false
          if ! git diff --quiet public/data/pricing.json; then
            CE_CHANGED=true
          fi
          if ! git diff --quiet public/data/cloudsql-pricing.json; then
            SQL_CHANGED=true
          fi
          if [ "$CE_CHANGED" = "true" ] || [ "$SQL_CHANGED" = "true" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push updated pricing
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/pricing.json public/data/cloudsql-pricing.json
          git commit -m "chore: update GCP pricing data [$(date -u +%Y-%m-%d)]"
          git push
